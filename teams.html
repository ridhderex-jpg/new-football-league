<div class="pagehead"><div class="wrap"><h1>Teams</h1><p>One team per state. Divisions are placeholders grouped by region.</p></div></div>
<section><div class="wrap">
<div class="tabs" role="group" aria-label="Filter by division"></div><ul id="teams"></ul></div></section>

<script>
// ---- Teams (edit freely; divisions are placeholders by U.S. region) ----
const DIVISIONS = {
  East:"Connecticut,Delaware,Maine,Maryland,Massachusetts,New Hampshire,New Jersey,New York,Pennsylvania,Rhode Island,Vermont,Virginia,West Virginia",
  North:"Illinois,Indiana,Iowa,Kansas,Michigan,Minnesota,Missouri,Nebraska,North Dakota,Ohio,South Dakota,Wisconsin",
  South:"Alabama,Arkansas,Florida,Georgia,Kentucky,Louisiana,Mississippi,North Carolina,Oklahoma,South Carolina,Tennessee,Texas",
  West:"Alaska,Arizona,California,Colorado,Hawaii,Idaho,Montana,Nevada,New Mexico,Oregon,Utah,Washington,Wyoming"
};
const teams = Object.entries(DIVISIONS).flatMap(([d,s])=>s.split(",").map(n=>({n,d})));
const list = document.getElementById("teams"), tabs = document.querySelector(".tabs");
let cur = "All";
function draw(){
  list.innerHTML = teams.filter(t=>cur==="All"||t.d===cur).sort((a,b)=>a.n.localeCompare(b.n))
    .map(t=>`<li>${t.n}<small>${t.d}</small></li>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===cur));
}
["All",...Object.keys(DIVISIONS)].forEach(d=>{
  const b=document.createElement("button");b.textContent=d;b.dataset.d=d;b.onclick=()=>{cur=d;draw()};tabs.appendChild(b);
});
draw();
</script>
</body></html>
